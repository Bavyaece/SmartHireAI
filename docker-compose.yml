services:
  smarthire:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - CORS_ORIGINS=*
    volumes:
      - ./backend:/app/backend
      - ./index.html:/app/index.html
      - ./css:/app/css
      - ./js:/app/js
      - ./assets:/app/assets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
